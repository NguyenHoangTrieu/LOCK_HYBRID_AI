CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=y
CONFIG_MCUX_COMPONENT_middleware.multicore.mcmgr=y
CONFIG_MCUX_COMPONENT_driver.inputmux=y
CONFIG_MCUX_COMPONENT_driver.inputmux_connections=y

# The top-level prj.conf (shared with the legacy single-core build) sets
# CONFIG_USB_DEVICE_CONFIG_VIDEO=1, which Kconfig `select`s the USB video
# class + EHCI + HS PHY components unconditionally (see that file's own
# comment) - this project never streams over USB in the dual-core build
# (already abandoned even in the legacy build, see ARCHITECTURE.md Sec.4),
# and this was eating real m_text budget on core1's tight 60KB region for
# entirely dead code. Trying to disable the derived component directly
# (`# CONFIG_MCUX_COMPONENT_middleware.usb.device.video is not set`) does
# NOT work - Kconfig `select` cannot be overridden by a later "is not set"
# on the selected symbol. Overriding the root trigger itself, in this
# later-merged per-core prj.conf, does work.
CONFIG_USB_DEVICE_CONFIG_VIDEO=0
