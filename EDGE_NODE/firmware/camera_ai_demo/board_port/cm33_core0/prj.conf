CONFIG_MCUX_COMPONENT_driver.inputmux=y
CONFIG_MCUX_COMPONENT_driver.inputmux_connections=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_project_folder=y

# Dual-core RTOS migration (see WORKLOG.md) - MCMGR is needed on both cores
# regardless of DUALCORE_RTOS's value here (harmless if unused by the
# legacy single-core build, since nothing calls into it unless
# main_core0.c is actually compiled in).
CONFIG_MCUX_COMPONENT_middleware.multicore.mcmgr=y
