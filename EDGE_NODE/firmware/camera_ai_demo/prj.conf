# SDK components this application needs (see ../../touch_rgb/prj.conf for the
# same pattern — the SDK only compiles drivers you switch on here).
# Based on mcuxsdk/mcuxsdk/examples/display_examples/smartdma_camera_flexio_mculcd/prj.conf
# (same camera + FlexIO combination), minus that example's ST7796S panel
# driver component - the panel in hand isn't ST7796S silicon, so
# source/display/lcd_flexio_mculcd.c talks to it directly instead.

# GPIO for the camera sync signals and LCD RST/CS/RS/BLK pins.
CONFIG_MCUX_COMPONENT_driver.gpio=y

# PORT pin muxing used by board_port/pin_mux.c
CONFIG_MCUX_COMPONENT_driver.port=y

# OV7670 camera device driver + SmartDMA capture firmware/driver.
CONFIG_MCUX_COMPONENT_driver.camera-device-ov7670=y
CONFIG_MCUX_COMPONENT_driver.smartdma=y

# SD card over SPI (TFT shield's onboard microSD slot, Arduino D10..D13 -
# see source/storage/sd_spi_disk.c). LPSPI1 driver - on this chip family
# LPSPI lives inside a LP_FLEXCOMM interface, so the Kconfig component is
# named "lpflexcomm_lpspi" (not the plain "driver.lpspi" some other MCX
# families use - that one depends on MCUX_HW_IP_DriverType_LPSPI, which
# isn't set for MCXN947; see devices/MCX/MCXN/MCXN947/Kconfig.chip's
# MCUX_HW_IP_DriverType_LPFLEXCOMM_LPSPI instead). Same fsl_lpspi.c/.h API
# either way. The SDK's chip-agnostic SD-over-SPI protocol layer
# (middleware/sdmmc/sdspi/fsl_sdspi.c) and FatFs (ff.c) are both pulled
# directly in CMakeLists.txt instead of via their own Kconfig components -
# see the comments there for why.
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpspi=y

# eDMA-driven LPSPI1 pixel push (source/spi1_bus.c's SPI1_BUS_TransferPixelsDMA(),
# used by the Arduino-header LCD's bulk pixel writes - see WORKLOG.md's
# 2026-09-04 "DMA" entry). "edma4" is this chip's actual eDMA IP generation
# (MCXN947 - confirmed via mcuxsdk's own frdmmcxn947 lpspi/edma_b2b_transfer
# example, which uses this exact component name), not the plain "edma" or
# "edma_rev2" variants other MCX families use - all three provide the same
# fsl_edma.h API under different implementations, selected by this Kconfig
# choice. "lpflexcomm_lpspi_edma" is the LPSPI+eDMA integration layer
# (fsl_lpspi_edma.c) - same naming pattern as lpflexcomm_lpspi above (LPSPI
# lives inside LP_FLEXCOMM on this chip).
CONFIG_MCUX_COMPONENT_driver.edma4=y
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpspi_edma=y

# J8 FlexIO/LCD header: FlexIO peripheral driver + MCULCD (8080/MIPI-DBI)
# transfer layer. No panel-specific driver component - see above.
CONFIG_MCUX_COMPONENT_driver.flexio=y
CONFIG_MCUX_COMPONENT_driver.flexio_mculcd=y

CONFIG_MCUX_COMPONENT_utility.assert_lite=y
CONFIG_MCUX_COMPONENT_utility.debug_console_lite=y

# No FreeRTOS here on purpose: this mirrors the bare-metal camera capture
# loop in mcuxsdk's own display_examples/smartdma_camera_flexio_mculcd
# example, which this project's camera+display path was adapted from.

# USB Video Class (UVC) device, streaming the camera over USB High-Speed -
# see source/usb/usb_video_camera.c and WORKLOG.md. These are the same lines
# mcuxsdk's own usb_device_video_virtual_camera example uses for this board
# (examples/usb_examples/usb_device_video_virtual_camera/bm/prj.conf).
# CONFIG_USB_DEVICE_CONFIG_VIDEO=1 is what actually pulls in the video
# class + EHCI controller + HS PHY components via Kconfig `select` (see
# middleware/usb/Kconfig) - unlike the stock example we don't need its
# CONFIG_MCUX_PRJSEG_module.board.pinmux_customize_folder /
# project.hw_app_customize_folder lines, since this project supplies its own
# board_port/ instead of using that customize-folder mechanism.
CONFIG_FSL_OSA_TASK_ENABLE=n
CONFIG_MCUX_COMPONENT_middleware.usb.common_header=y
CONFIG_MCUX_COMPONENT_middleware.usb.device.common_header=y
CONFIG_MCUX_PRJSEG_component.osa_interface.generated_config=y
CONFIG_USB_DEVICE_CONFIG_ROOT2_TEST=y
CONFIG_USB_DEVICE_CONFIG_VIDEO=1
